<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07111b">
  <title>Open World 3D</title>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div id="mission"><small>MISSION</small><strong id="missionText">Explore the world</strong></div>
    <div id="status"><span id="mode">ON FOOT</span><span id="speed">0 km/h</span></div>
    <div id="joystick"><div id="stick"></div></div>
    <button id="jump" class="control">JUMP</button>
    <button id="action" class="control">ENTER CAR</button>
    <button id="interact" class="control">NEXT MISSION</button>
    <div id="hint">Move: joystick · Look: drag right side · Keyboard: WASD</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
